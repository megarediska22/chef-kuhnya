<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f2" />
    <meta name="description" content="Шеф кухня — домашние супы, вторые блюда и завтраки для морозилки. Соберите свой запас в демонстрационном магазине." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Шеф кухня — обед уже в морозилке" />
    <meta property="og:description" content="Домашние блюда порциями. Познакомьтесь с пилотным меню и соберите демонстрационную корзину." />
    <meta property="og:url" content="https://megarediska22.github.io/chef-kuhnya/" />
    <meta property="og:image" content="https://megarediska22.github.io/chef-kuhnya/media/cover.jpg" />
    <meta property="og:image:alt" content="Иллюстрация подачи борща с говядиной" />
    <script>
      (() => {
        const path = location.hash.slice(1) || '/'
        let set, sizes
        if (path === '/') {
          set = './media/hero-480.avif 480w, ./media/hero-800.avif 800w, ./media/hero-1200.avif 1200w'
          sizes = '(max-width: 760px) 92vw, 52vw'
        } else if (path === '/catalog') {
          set = './media/sk01-360.avif 360w, ./media/sk01-720.avif 720w'
          sizes = '(max-width: 480px) 92vw, (max-width: 760px) 46vw, (max-width: 1024px) 30vw, 23vw'
        } else { return }
        const link = document.createElement('link')
        Object.assign(link, {rel: 'preload', as: 'image', type: 'image/avif', imageSrcset: set, imageSizes: sizes, fetchPriority: 'high'})
        document.head.append(link)
      })()
    </script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Шеф кухня — обед уже в морозилке</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Чтобы выбрать блюда и собрать демонстрационную корзину, включите JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
